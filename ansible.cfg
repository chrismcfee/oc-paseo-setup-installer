# Run this repo from its root:  ansible-playbook site.yml --ask-become-pass
# The vault password is resolved by ./vault-pass.sh (env var, .vault_pass file, or keyring), so you
# don't pass --ask-vault-pass every time.
[defaults]
# The `paseo` role lives at ./paseo, so the role search path is the repo root.
roles_path = .
inventory = inventory.yml
host_key_checking = True
# Quieter, per-task timing is handy on a fleet; drop if you prefer the default callback.
stdout_callback = default
# Resolve the vault password automatically (no --ask-vault-pass). See vault-pass.sh.
vault_password_file = ./vault-pass.sh
