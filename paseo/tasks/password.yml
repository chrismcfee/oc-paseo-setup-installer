---
# `set-password` writes a *fresh* bcrypt salt every run, so it can never be idempotent on its
# own. We gate it on a sha256 marker of the desired password: skip when unchanged, re-run on
# rotation. The marker is non-reversible; nothing here logs the secret.

- name: Compute password marker
  ansible.builtin.set_fact:
    _paseo_pw_marker: "{{ paseo_daemon_password | hash('sha256') }}"
  no_log: true

- name: Read existing password marker
  ansible.builtin.slurp:
    src: "{{ paseo_state_dir }}/.ansible_pw_marker"
  register: _paseo_pw_marker_raw
  failed_when: false

- name: Decide whether the password must be (re)set
  ansible.builtin.set_fact:
    _paseo_pw_changed: >-
      {{ (_paseo_pw_marker_raw.content is not defined)
         or ((_paseo_pw_marker_raw.content | b64decode | trim) != _paseo_pw_marker) }}
  no_log: true

- name: Set the daemon password
  ansible.builtin.command:
    argv: "{{ paseo_set_password_argv }}"
    stdin: "{{ paseo_set_password_stdin }}"
  environment:
    PASEO_HOME: "{{ paseo_state_dir }}"
    PATH: "{{ paseo_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
  become: true
  become_user: "{{ paseo_user }}"
  no_log: true
  when: _paseo_pw_changed | bool
  notify: restart paseo

- name: Persist the password marker
  ansible.builtin.copy:
    content: "{{ _paseo_pw_marker }}\n"
    dest: "{{ paseo_state_dir }}/.ansible_pw_marker"
    owner: "{{ paseo_user }}"
    group: "{{ paseo_group }}"
    mode: "0600"
  no_log: true
  when: _paseo_pw_changed | bool
