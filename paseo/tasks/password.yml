---
# `paseo daemon set-password` is a pure interactive TTY prompt (@clack/prompts) — no --stdin/--password
# flag — and it crashes on Node < 22 (util.styleText array form). So we never call it. Instead we hash
# the password with paseo's OWN hashDaemonPassword() (bcryptjs, cost 12 — byte-for-byte identical to
# what set-password would persist) on the target, and merge the hash into config.json at
# daemon.auth.password (the exact key + BcryptHashSchema the daemon validates). Gated on a sha256
# marker of the desired password so the bcrypt salt only changes on a real rotation (no churn / no
# needless restarts). Secret-bearing steps are censored via paseo_no_log (default true); for
# debugging a failing task run with -e paseo_no_log=false to see real errors, then flip it back.

- name: Compute password marker
  ansible.builtin.set_fact:
    _paseo_pw_marker: "{{ paseo_daemon_password | hash('sha256') }}"
  no_log: "{{ paseo_no_log }}"

- name: Read existing password marker
  ansible.builtin.slurp:
    src: "{{ paseo_state_dir }}/.ansible_pw_marker"
  register: _paseo_pw_marker_raw
  failed_when: false

- name: Decide whether the password must be (re)set
  ansible.builtin.set_fact:
    _paseo_pw_changed: >-
      {{ (_paseo_pw_marker_raw.content is not defined)
         or ((_paseo_pw_marker_raw.content | b64decode | trim) != _paseo_pw_marker) }}
  no_log: "{{ paseo_no_log }}"

# Hash with paseo's own function so cost/algorithm always match the daemon's verifier exactly. Run
# from the CLI package dir so `import('@getpaseo/server')` resolves; node comes from PATH.
- name: Hash the daemon password with paseo's own hasher (bcryptjs, cost 12)
  ansible.builtin.command:
    argv:
      - node
      - --input-type=module
      - -e
      - "const m = await import('@getpaseo/server'); process.stdout.write(m.hashDaemonPassword(process.env.PASEO_NEW_PASSWORD))"
    chdir: "{{ paseo_cli_pkg_dir }}"
  environment:
    PASEO_NEW_PASSWORD: "{{ paseo_daemon_password }}"
    PATH: "{{ paseo_service_path }}"
  become: true
  become_user: "{{ paseo_user }}"
  register: _paseo_pw_hash
  changed_when: false
  no_log: "{{ paseo_no_log }}"
  when: _paseo_pw_changed | bool

- name: Read existing daemon config (for the password merge)
  ansible.builtin.slurp:
    src: "{{ paseo_state_dir }}/config.json"
  register: _paseo_pw_cfg_raw
  failed_when: false
  when: _paseo_pw_changed | bool

- name: Write the password hash into config.json (daemon.auth.password)
  ansible.builtin.copy:
    content: >-
      {{ ((_paseo_pw_cfg_raw.content | b64decode | from_json)
            if (_paseo_pw_cfg_raw.content is defined and (_paseo_pw_cfg_raw.content | length) > 0)
            else {})
         | combine({'daemon': {'auth': {'password': _paseo_pw_hash.stdout | trim}}}, recursive=True)
         | to_nice_json }}
    dest: "{{ paseo_state_dir }}/config.json"
    owner: "{{ paseo_user }}"
    group: "{{ paseo_group }}"
    mode: "0600"
  no_log: "{{ paseo_no_log }}"
  when: _paseo_pw_changed | bool
  notify: restart paseo

- name: Persist the password marker
  ansible.builtin.copy:
    content: "{{ _paseo_pw_marker }}\n"
    dest: "{{ paseo_state_dir }}/.ansible_pw_marker"
    owner: "{{ paseo_user }}"
    group: "{{ paseo_group }}"
    mode: "0600"
  no_log: "{{ paseo_no_log }}"
  when: _paseo_pw_changed | bool
