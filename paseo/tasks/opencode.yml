---
# Everything OpenCode-side. Independent blocks:
#   0) deploy a sanitized opencode.json[c] (+ extra files, + optional auth.json) for the daemon user
#   A) discover the config path -> optionally fetch it back -> optionally inject the MCP block
#   B) print OpenCode's effective (merged) config to the play output
# Runs as paseo_user with that user's HOME so XDG / OPENCODE_CONFIG / project-local resolve right.

# ===========================================================================
# 0) deploy the sanitized OpenCode config (dedicated-user mode)
# Secrets in the config are {env:VAR} placeholders; the matching VALUES are injected into the daemon
# ENVIRONMENT from paseo_opencode_secrets (see service.yml + paseo.env.j2), so nothing secret is
# templated here. auth.json (provider creds) is optional and only written when provided via Vault.
# ===========================================================================
- name: Deploy the OpenCode config
  when: paseo_deploy_opencode_config | bool
  block:
    - name: Resolve the sanitized config source on the controller
      ansible.builtin.set_fact:
        _paseo_oc_src: >-
          {{ paseo_opencode_config_src
             if (paseo_opencode_config_src is match('^/'))
             else (role_path ~ '/files/' ~ paseo_opencode_config_src) }}

    - name: Pre-flight — sanitized OpenCode config exists on the controller
      ansible.builtin.stat:
        path: "{{ _paseo_oc_src }}"
      delegate_to: localhost
      become: false
      register: _paseo_oc_src_stat

    - name: Require the sanitized OpenCode config
      ansible.builtin.assert:
        that: _paseo_oc_src_stat.stat.exists
        fail_msg: >-
          No sanitized OpenCode config at {{ _paseo_oc_src }}. Point paseo_opencode_config_src at your
          sanitized opencode.json[c] (secrets replaced by {env:VAR}); see the README. Or set
          paseo_deploy_opencode_config: false.
        quiet: true

    - name: Ensure the OpenCode config directory exists
      ansible.builtin.file:
        path: "{{ paseo_opencode_config_dest | dirname }}"
        state: directory
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0750"

    - name: Deploy the sanitized OpenCode config
      ansible.builtin.copy:
        src: "{{ _paseo_oc_src }}"
        dest: "{{ paseo_opencode_config_dest }}"
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0640"
      notify: restart paseo

    - name: Deploy extra OpenCode files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "{{ item.mode | default('0640') }}"
      loop: "{{ paseo_opencode_extra_files }}"
      loop_control:
        label: "{{ item.dest }}"
      notify: restart paseo

    - name: Ensure the OpenCode data directory exists (for auth.json)
      ansible.builtin.file:
        path: "{{ paseo_opencode_auth_dest | dirname }}"
        state: directory
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0700"
      when: paseo_opencode_auth | length > 0

    - name: Deploy the OpenCode auth.json (provider credentials)
      ansible.builtin.copy:
        content: "{{ paseo_opencode_auth | to_nice_json }}\n"
        dest: "{{ paseo_opencode_auth_dest }}"
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0600"
      no_log: true
      when: paseo_opencode_auth | length > 0
      notify: restart paseo

    # So the optional MCP-merge below targets the file we just deployed instead of re-discovering.
    - name: Default the OpenCode config path to the deployed file
      ansible.builtin.set_fact:
        paseo_opencode_config_path: "{{ paseo_opencode_config_dest }}"
      when: paseo_opencode_config_path | length == 0

# ===========================================================================
# A) discover + fetch + wire   (only when we need a concrete config path)
# ===========================================================================
- name: Resolve / fetch / wire the OpenCode config
  when: (paseo_manage_opencode_mcp | bool) or (paseo_fetch_opencode_config | bool)
  block:
    - name: Resolve the OpenCode config path on the target
      ansible.builtin.script: >-
        resolve-opencode-config.sh --explain{{ (' --cwd ' ~ paseo_opencode_config_cwd)
          if (paseo_opencode_config_cwd | length > 0) else '' }}
      args:
        executable: /bin/sh
      environment:
        HOME: "{{ paseo_home_dir }}"
      become: true
      become_user: "{{ paseo_user }}"
      register: _paseo_oc_resolve
      changed_when: false
      when:
        - paseo_discover_opencode_config | bool
        - paseo_opencode_config_path | length == 0

    - name: Adopt the resolved OpenCode config path
      ansible.builtin.set_fact:
        paseo_opencode_config_path: "{{ _paseo_oc_resolve.stdout | trim }}"
      when:
        - _paseo_oc_resolve.stdout is defined
        - (_paseo_oc_resolve.stdout | trim) | length > 0
        - paseo_opencode_config_path | length == 0

    - name: Require a known OpenCode config path
      ansible.builtin.assert:
        that: paseo_opencode_config_path | length > 0
        fail_msg: >-
          Could not determine an OpenCode config path. Set paseo_opencode_config_path explicitly,
          or provide OPENCODE_CONFIG / paseo_opencode_config_cwd so discovery can resolve it.
        quiet: true

    - name: Stat the resolved OpenCode config
      ansible.builtin.stat:
        path: "{{ paseo_opencode_config_path }}"
      become: true
      become_user: "{{ paseo_user }}"
      register: _paseo_oc_stat

    # ---- pull the config back to the controller (per host: <dir>/<host>/<path>) ----
    - name: Fetch the OpenCode config to the controller
      ansible.builtin.fetch:
        src: "{{ paseo_opencode_config_path }}"
        dest: "{{ paseo_opencode_config_fetch_dir }}/"
        flat: false
      become: true
      become_user: "{{ paseo_user }}"
      when:
        - paseo_fetch_opencode_config | bool
        - _paseo_oc_stat.stat.exists

    - name: Report when there is nothing to fetch
      ansible.builtin.debug:
        msg: >-
          No OpenCode config at {{ paseo_opencode_config_path }} to fetch.
          (Enable paseo_manage_opencode_mcp to create one with the paseo MCP block.)
      when:
        - paseo_fetch_opencode_config | bool
        - not _paseo_oc_stat.stat.exists

    # ---- inject the paseo MCP block (Direction B): deep-merge, nothing else touched ----
    - name: Read existing OpenCode config (for merge)
      ansible.builtin.slurp:
        src: "{{ paseo_opencode_config_path }}"
      register: _paseo_oc_raw
      failed_when: false
      become: true
      become_user: "{{ paseo_user }}"
      when: paseo_manage_opencode_mcp | bool

    - name: Ensure the OpenCode config directory exists
      ansible.builtin.file:
        path: "{{ paseo_opencode_config_path | dirname }}"
        state: directory
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0750"
      become: true
      when: paseo_manage_opencode_mcp | bool

    - name: Merge the paseo MCP block into the OpenCode config
      ansible.builtin.copy:
        content: >-
          {{ ((_paseo_oc_raw.content | b64decode | from_json)
                if (_paseo_oc_raw.content is defined and (_paseo_oc_raw.content | length) > 0)
                else {'$schema': 'https://opencode.ai/config.json'})
             | combine({'mcp': {'paseo': {
                 'type': 'remote',
                 'url': paseo_opencode_mcp_url,
                 'enabled': true,
                 'oauth': false,
                 'headers': {'Authorization': 'Bearer {env:PASEO_PASSWORD}'}
               }}}, recursive=True)
             | to_nice_json }}
        dest: "{{ paseo_opencode_config_path }}"
        owner: "{{ paseo_user }}"
        group: "{{ paseo_group }}"
        mode: "0644"
      become: true
      when: paseo_manage_opencode_mcp | bool

# ===========================================================================
# B) print OpenCode's effective (merged) config
# ===========================================================================
- name: Print OpenCode's effective config
  when: paseo_print_opencode_config | bool
  block:
    - name: Compute the effective OpenCode config
      ansible.builtin.script: >-
        opencode-effective-config.py --explain{{ (' --cwd ' ~ paseo_opencode_config_cwd)
          if (paseo_opencode_config_cwd | length > 0) else '' }}{{ ' --raw'
          if (paseo_print_opencode_config_raw | bool) else '' }}
      environment:
        HOME: "{{ paseo_home_dir }}"
      become: true
      become_user: "{{ paseo_user }}"
      register: _paseo_oc_effective
      changed_when: false

    - name: Show the effective OpenCode config
      ansible.builtin.debug:
        var: _paseo_oc_effective.stdout_lines
