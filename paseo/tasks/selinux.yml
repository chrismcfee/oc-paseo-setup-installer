---
# On SELinux-enforcing RedHat/Fedora, a systemd service (init_t) may NOT execute files labeled
# var_lib_t — which is what npm and the OpenCode installer leave under /var/lib/paseo. Without this,
# `paseo daemon start` dies with 203/EXEC ("Permission denied") and the unit crash-loops, and the
# OpenCode it later launches would be blocked too. We label the Paseo CLI prefix and the OpenCode
# binary as bin_t (persistently, so it survives a filesystem relabel) and apply it now.

- name: Ensure semanage is available (persistent SELinux file contexts)
  ansible.builtin.package:
    name: policycoreutils-python-utils
    state: present

- name: Label the Paseo CLI prefix and OpenCode binary as bin_t
  community.general.sefcontext:
    target: "{{ item }}"
    setype: bin_t
    state: present
  loop:
    # Whole npm prefix: the daemon never writes here at runtime, and the exec'd CLI shims live under it.
    - "{{ paseo_npm_prefix }}(/.*)?"
    # Only OpenCode's bin/ (the launched binary) — the rest of ~/.opencode stays writable (var_lib_t).
    - "{{ paseo_opencode_install_dir }}/bin(/.*)?"
  notify: restart paseo

- name: Apply the new SELinux labels now
  ansible.builtin.command:
    cmd: "restorecon -RFv {{ paseo_npm_prefix }} {{ paseo_opencode_install_dir }}"
  register: _paseo_restorecon
  changed_when: (_paseo_restorecon.stdout | default('') | length) > 0
  notify: restart paseo
