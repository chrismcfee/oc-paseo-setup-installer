---
# =============================================================================
# Identity / service user
# =============================================================================
paseo_user: paseo
paseo_group: paseo
# Home lives under /var/lib (NOT /home) on purpose: a hardened systemd unit with
# ProtectHome=true can still write here. See "own-user mode" in the README if you
# instead run the daemon as your login user (home under /home).
paseo_home_dir: /var/lib/paseo
paseo_user_shell: /bin/bash

# PASEO_HOME — where config.json, daemon.log, daemon-keypair.json and worktrees/ live.
# Give each daemon-on-a-host a distinct value if you ever run more than one per box.
paseo_state_dir: "{{ paseo_home_dir }}/.paseo"

# =============================================================================
# Node.js + npm + the Paseo CLI
# =============================================================================
# Set false if you manage Node yourself (nvm/asdf/already-present). The version
# assertion below still runs so you fail fast on too-old Node.
paseo_manage_node: true
paseo_install_github_cli: true
paseo_min_node_major: 22         # paseo's CLI prompts use util.styleText's array form (Node >= 22)

paseo_npm_prefix: "{{ paseo_home_dir }}/.npm-global"
paseo_bin_dir: "{{ paseo_npm_prefix }}/bin"
paseo_bin: "{{ paseo_bin_dir }}/paseo"

paseo_cli_package: "@getpaseo/cli"
paseo_cli_version: ""            # pin a version e.g. "0.1.101"; empty = track latest
# The password step runs paseo's own hashDaemonPassword() from inside the installed CLI package via
# `node`, so it never depends on the broken set-password prompt. This is the common-case path; on
# lib64 profiles (Gentoo) npm's global root is <prefix>/lib64/node_modules, so install.yml overrides
# this fact at runtime from `npm root -g`. Leave as-is unless you skip the CLI install entirely.
paseo_cli_pkg_dir: "{{ paseo_npm_prefix }}/lib/node_modules/{{ paseo_cli_package }}"

paseo_symlink_cli: true          # symlink paseo into /usr/local/bin for admin convenience
# If the daemon runs as a dedicated user, the agent CLI it spawns (opencode) must be
# on that user's PATH. We bake PATH into the unit (below), but symlinking the binary
# into /usr/local/bin is the belt-and-suspenders fix. Point this at your opencode binary.
paseo_opencode_bin: ""           # e.g. /usr/bin/opencode — empty = skip the symlink

# PATH the daemon runs with. Agent-CLI bin dirs come FIRST so the CLI Paseo launches is found
# (runbook §9 "can't find binary"). This is the ONLY discovery lever for provider availability:
# Paseo resolves a provider by running `which -a <cli>` inside the daemon process, so a CLI that
# isn't on THIS path reports "unavailable" no matter what config.json says.
#
# Built from a list and joined, not hand-concatenated: `reject('eq','')` drops disabled agents so
# an off Claude/OpenCode install can never leave an empty `::` element — an empty PATH element
# means the CURRENT DIRECTORY, which for a root-installed unit is a real privilege problem.
paseo_agent_path_dirs:
  - "{{ (paseo_opencode_install_dir ~ '/bin') if paseo_install_opencode | bool else '' }}"
  - "{{ paseo_claude_bin_dir if paseo_install_claude | bool else '' }}"
  - "{{ paseo_kimicode_bin_dir if paseo_install_kimicode | bool else '' }}"
  - "{{ paseo_bin_dir }}"
paseo_service_path: "{{ (paseo_agent_path_dirs | reject('eq', '') | join(':')) ~ ':/usr/local/bin:/usr/bin:/bin' }}"

# =============================================================================
# Network / bind (NetBird mesh) — OVERRIDE PER HOST
# =============================================================================
# Bind to the mesh IP, never 0.0.0.0. The listen IP is auto-added to the Host-header
# allowlist so you don't hit the "open port + valid password, still rejected" trap.
paseo_listen: "127.0.0.1:6767"           # per host: "100.x.x.x:6767"
paseo_hostnames:                          # extra Host-header names (the listen IP is added for you)
  - localhost
  - 127.0.0.1
paseo_worktrees_root: "{{ paseo_state_dir }}/worktrees"

# Paseo's hosted relay (app.paseo.sh) lets the Paseo app reach the daemon WITHOUT the mesh. For a
# NetBird-only fleet you usually don't want each box dialing the public relay — default off. Set true
# to use Paseo's relay/pairing instead of (or alongside) the mesh.
paseo_relay_enabled: false

# =============================================================================
# Service / init system
# =============================================================================
paseo_init_system: "{{ ansible_service_mgr }}"   # auto-detected: 'systemd' or 'openrc'
paseo_service_enabled: true
paseo_service_state: started

# Order the daemon after NetBird so the mesh IP exists before bind (EADDRNOTAVAIL otherwise).
paseo_after_netbird: true
paseo_netbird_unit: netbird                       # systemd: <name>.service ; openrc: after <name>

# CRITICAL (systemd): `paseo daemon start` is a self-detaching launcher that exits 0.
# Under Type=simple that gets the real worker SIGTERM'd at launcher exit (KillMode=control-group)
# — the exact double-detach bug the runbook avoids for OpenRC. We run it in the FOREGROUND so the
# worker IS the main PID and Restart=on-failure actually supervises it. REVIEW FIX.
# >>> VERIFY this flag on your build: `paseo daemon start --help` (could be --no-detach / run). <<<
paseo_foreground_flag: "--foreground"
paseo_restart_sec: 3

# systemd hardening. Keep ProtectHome=true ONLY while home is under /var/lib. If you run the
# daemon as your login user (home under /home, "own-user mode" for Direction A), set this false
# or opencode can't read its config/creds.
paseo_systemd_protect_home: true

# SELinux (RedHat/Fedora): the systemd service can't execute the Paseo CLI / OpenCode under
# /var/lib (they're labeled var_lib_t -> 203/EXEC). When true, the role relabels them bin_t. Set
# false only if you manage SELinux yourself or run permissive/disabled.
paseo_manage_selinux: true

# =============================================================================
# Auth (Ansible Vault)
# =============================================================================
# Censor secret-bearing task output (passwords, provider keys). Flip to false ONLY when
# debugging a failing task (-e paseo_no_log=false) — with it off, plaintext secrets land in
# Ansible/CI logs on -v, --diff, and failures. Never commit/ship runs with it off.
paseo_no_log: true

# Set false to rely on the NetBird mesh as the sole access boundary (no daemon password).
paseo_set_password: true
paseo_daemon_password: ""        # REQUIRED when paseo_set_password — pull from Vault

# NOTE: `paseo daemon set-password` is a pure interactive TTY prompt (no --stdin/--password flag) and
# crashes on Node < 22, so the role does NOT call it. It hashes the password with paseo's OWN
# hashDaemonPassword() (bcryptjs cost 12 — byte-for-byte what set-password stores) on the target and
# writes the hash to config.json at daemon.auth.password. Nothing to configure here. See tasks/password.yml.

# =============================================================================
# OpenCode: download + install, and deploy a (sanitized) config — dedicated-user mode
# =============================================================================
# Install the OpenCode CLI for paseo_user via the official installer, and deploy a sanitized
# opencode.json whose secrets are externalized as {env:VAR}. Set both false to keep OpenCode
# entirely out of scope (original behavior: only discover / fetch / print / MCP-wire below).
paseo_install_opencode: true
paseo_deploy_opencode_config: true

# --- install (official installer: curl | bash) -------------------------------------------------
# Always downloads a prebuilt binary from GitHub releases into ~/.opencode/bin and honors VERSION=.
# Needs curl + tar on the target and outbound access to github.com.
paseo_opencode_install_url: "https://opencode.ai/install"
paseo_opencode_version: ""          # pin e.g. "1.17.9"; empty = latest at first install
paseo_opencode_upgrade: false       # re-run the installer every play even if present (honors version)
paseo_opencode_install_dir: "{{ paseo_home_dir }}/.opencode"      # installer hardcodes ~/.opencode
paseo_opencode_installed_bin: "{{ paseo_opencode_install_dir }}/bin/opencode"
paseo_opencode_symlink: true        # symlink the binary into /usr/local/bin/opencode too

# --- config deployment -------------------------------------------------------------------------
# The sanitized config lives on the CONTROLLER. Generate it (and the vault secrets) from your real
# config with files/sanitize-opencode-config.py — never commit the real one. A bare filename is
# looked up in the role's files/ dir; an absolute path is used as-is.
paseo_opencode_config_src: "opencode.json"
paseo_opencode_config_dest: "{{ paseo_home_dir }}/.config/opencode/{{ paseo_opencode_config_src | basename }}"
# Extra OpenCode files to ship next to it (AGENTS.md, instructions, …): list of {src, dest[, mode]}.
paseo_opencode_extra_files: []

# --- secrets (externalized) --------------------------------------------------------------------
# Real values for the {env:VAR} placeholders in the sanitized config. Injected into the DAEMON
# ENVIRONMENT (systemd EnvironmentFile + OpenRC source), so {env:VAR} resolves when Paseo launches
# OpenCode. PULL FROM VAULT — never put real values here. (You can include PASEO_PASSWORD here too,
# e.g. for the mcp.paseo loopback block.) Values must be single-line and free of single quotes.
#   paseo_opencode_secrets:
#     OPENCODE_PROVIDER_TENSORZERO_OPTIONS_APIKEY: "{{ vault_tensorzero_api_key }}"
paseo_opencode_secrets: {}
paseo_env_file: /etc/paseo/paseo.env        # root:paseo 0640; loaded by both init systems

# --- provider credentials (optional auth.json) -------------------------------------------------
# Some providers (your primary model's provider, or built-ins added via `opencode auth login`) keep
# credentials in ~/.local/share/opencode/auth.json rather than in opencode.json. If yours does,
# provide that JSON as a dict FROM VAULT and the role writes it for the daemon user (0600).
# Empty = skip (use this only if an {env:VAR} apiKey in the config isn't enough).
paseo_opencode_auth: {}
paseo_opencode_auth_dest: "{{ paseo_home_dir }}/.local/share/opencode/auth.json"

# =============================================================================
# OpenCode MCP client wiring — Direction B (runbook §5), optional
# =============================================================================
# Injects only the `mcp.paseo` block into an existing opencode.json (deep-merge, your other
# config is preserved). oauth:false + {env:PASEO_PASSWORD} per §5; a launched OpenCode reading
# this also sidesteps bug #914 (§6).
paseo_manage_opencode_mcp: false
paseo_opencode_mcp_url: "http://127.0.0.1:6767/mcp/agents"

# OpenCode config discovery / fetch
# Leave paseo_opencode_config_path empty to auto-resolve it on the target (honors OPENCODE_CONFIG,
# XDG, and — if paseo_opencode_config_cwd is set — a project-local opencode.json). Set it to skip
# discovery and target a specific file.
paseo_opencode_config_path: ""
paseo_discover_opencode_config: true
paseo_opencode_config_cwd: ""            # if set, also consider a project-local config under this dir
# Pull the resolved config back to the controller, one copy per host:
#   <fetch_dir>/<inventory_hostname>/<remote/path/opencode.json>
paseo_fetch_opencode_config: false
paseo_opencode_config_fetch_dir: "./fetched-opencode"

# Print OpenCode's effective (merged) config to the play output. Reproduces opencode's
# global+project+OPENCODE_CONFIG merge from the files (an approximation — see README).
paseo_print_opencode_config: false
paseo_print_opencode_config_raw: false        # default redacts secrets; true keeps them

# =============================================================================
# Claude Code: install + register as a Paseo agent provider — dedicated-user mode
# =============================================================================
# `claude` is a FIRST-CLASS BUILTIN provider in Paseo (alongside codex/copilot/opencode/pi/omp),
# driven through @anthropic-ai/claude-agent-sdk. Nothing needs to be added to config.json for
# Paseo to offer it — but the daemon only reports it "available" if the binary is findable, so
# these tasks install it, put it on the daemon's PATH, and pin its absolute path in config.json.
# Off by default: enabling it downloads a ~260 MB binary per host.
paseo_install_claude: false
paseo_deploy_claude_settings: true          # deploy ~/.claude/settings.json (needs install)

# --- install (Anthropic's native installer: curl | bash) ---------------------------------------
# Self-contained ELF binary (glibc >= 2.17), no Node at runtime, ripgrep embedded. Needs bash +
# (curl or wget) + sha256sum on the target, outbound HTTPS, and ~512 MB free RAM to install.
# Anthropic ships signed apt/dnf/apk repos too, but not for Gentoo or Arch — the native installer
# is the only uniform path across all four families this role supports.
paseo_claude_install_url: "https://claude.ai/install.sh"
# Pin an exact version e.g. "2.1.212", or a channel: "stable" / "latest". Pinning is STRONGLY
# preferred for a fleet — `latest` means two hosts provisioned a day apart run different builds.
paseo_claude_version: "stable"
paseo_claude_upgrade: false                 # re-pin every play even when already at a good version
# Installer layout is hardcoded to the user's home; it is not configurable via a flag.
paseo_claude_install_dir: "{{ paseo_home_dir }}/.local/share/claude"
paseo_claude_bin_dir: "{{ paseo_home_dir }}/.local/bin"
paseo_claude_installed_bin: "{{ paseo_claude_bin_dir }}/claude"
paseo_claude_symlink: true                  # also symlink into /usr/local/bin/claude

# --- credentials -------------------------------------------------------------------------------
# Merged into the SAME daemon env file as paseo_opencode_secrets (one EnvironmentFile, one sourced
# file — see tasks/service.yml), so the claude Paseo spawns inherits them. PULL FROM VAULT.
# ANTHROPIC_API_KEY is the documented headless credential and is always used in non-interactive
# runs. For a gateway instead, set ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN here — note Claude
# Code speaks the Anthropic Messages API (POST /v1/messages), NOT an OpenAI-compatible endpoint.
#   paseo_claude_secrets:
#     ANTHROPIC_API_KEY: "{{ vault_anthropic_api_key }}"
paseo_claude_secrets: {}

# Preflight the credential from the TARGET and report the result — but never fail the play. A bad
# key is otherwise invisible at provision time: Paseo decides a provider is "available" by finding
# the binary, not by checking auth, so a host with a dead key still provisions green and reports
# ready, then fails at the first prompt.
#
# Deliberately non-fatal. Fleet provisioning shouldn't stop because one credential is stale, and the
# check itself can be wrong (no egress, a gateway that's down, a proxy in the way) — so a failure
# here is a warning, not a verdict. Only a definitive HTTP 401 is reported as "rejected"; anything
# else is reported as "could not verify" with the reason.
paseo_verify_claude_credential: true
# Model used for the 1-token probe. Only matters for the 200 case: a retired name returns 404, which
# is already classified as "could not verify" rather than a bad key, so this drifting is harmless.
paseo_claude_preflight_model: "claude-haiku-4-5-20251001"

# --- settings.json -----------------------------------------------------------------------------
# The role owns ~/.claude/settings.json outright: the installer does NOT create it, so there is no
# merge conflict. Deployed 0600 because an `env` block here may carry a credential.
paseo_claude_settings_dest: "{{ paseo_home_dir }}/.claude/settings.json"
# Freeze the pinned version: DISABLE_AUTOUPDATER stops background update checks (manual `claude
# update` still works; use DISABLE_UPDATES=1 to block that too). An `env` block in a settings file
# outranks the same variable from the shell and is read BEFORE first-run setup.
paseo_claude_settings:
  env:
    DISABLE_AUTOUPDATER: "1"
# Deep-merged over the above, so you can add keys without restating them.
paseo_claude_settings_extra: {}

# --- Paseo provider registration ---------------------------------------------------------------
# Pins the ABSOLUTE binary path at config.json -> agents.providers.claude.command. Verified against
# the daemon's own schema: a `command` array takes the override branch of resolveProviderLaunch and
# is checked with a literal existsSync, so it needs no PATH at all — belt-and-suspenders against a
# PATH regression. `command` must be a non-empty array of strings; a bare string is rejected.
# We set that ONE key and nothing else. `enabled: true` would be accepted but is redundant (the
# provider is on by default), and the root + `daemon` levels of config.json are strict-schema, so
# the less this role writes there, the less it can break on a daemon upgrade.
paseo_register_claude_provider: true

# First-run gate. A fresh dedicated-user HOME shows an onboarding wizard that blocks
# non-interactive use, recorded as `hasCompletedOnboarding` in ~/.claude.json. That key is
# UNDOCUMENTED internal state, not a supported config interface — we merge it in (never
# overwrite the file: the installer also stores machineID and update state there) and accept it
# may change between releases. The verify step below is what catches that. Set false if you'd
# rather run `claude` once by hand per host.
paseo_seed_claude_onboarding: true

# =============================================================================
# Kimi Code: install + register as a Paseo agent provider — dedicated-user mode
# =============================================================================
# `kimi` is registered as a custom provider in Paseo (not a builtin like claude/opencode),
# driven through the ACP bridge (`kimi acp` — JSON-RPC over stdio). Kimi Code speaks ACP
# natively with 10/12 agent methods implemented: initialize, authenticate, session/new,
# session/prompt, session/cancel, session/list, and more. No separate bridge needed —
# Paseo connects directly to the `kimi acp` subprocess.
#
# Off by default: enabling it downloads a ~150 MB binary per host. The official installer
# is a single-binary distribution with no Node.js requirement.
paseo_install_kimicode: false
paseo_deploy_kimicode_settings: true          # deploy ~/.kimi-code/config.json (needs install)

# --- install (Moonshot's official installer: curl | bash) ---------------------------------------
# Self-contained single-binary distribution (no Node.js at runtime). Needs bash + curl on the
# target, outbound HTTPS to code.kimi.com, and ~256 MB free RAM to install.
# The script always fetches the latest release — there is no explicit version pinning via the
# installer. For fleet stability, pin the binary path in config.json at the provider level.
paseo_kimicode_install_url: "https://code.kimi.com/kimi-code/install.sh"
paseo_kimicode_upgrade: false                 # re-run the installer every play even if present
# Kimi Code installs into ~/.local/bin/kimi with data at ~/.kimi-code/ (overridable via
# KIMI_CODE_HOME env var).
paseo_kimicode_data_dir: "{{ paseo_home_dir }}/.kimi-code"
paseo_kimicode_bin_dir: "{{ paseo_home_dir }}/.local/bin"
paseo_kimicode_installed_bin: "{{ paseo_kimicode_bin_dir }}/kimi"
paseo_kimicode_symlink: true                  # also symlink into /usr/local/bin/kimi

# --- credentials --------------------------------------------------------------------------------
# Merged into the SAME daemon env file as paseo_opencode_secrets + paseo_claude_secrets (one
# EnvironmentFile — see tasks/service.yml), so the kimi Paseo spawns inherits them. PULL FROM
# VAULT. MOONSHOT_API_KEY is the documented headless credential. For a gateway instead, set
# MOONSHOT_BASE_URL + MOONSHOT_AUTH_TOKEN here.
#   paseo_kimicode_secrets:
#     MOONSHOT_API_KEY: "{{ vault_moonshot_api_key }}"
paseo_kimicode_secrets: {}

# Preflight the credential from the TARGET and report the result — but never fail the play. A bad
# key is otherwise invisible at provision time: Paseo decides a provider is "available" by finding
# the binary, not by checking auth, so a host with a dead key still provisions green and reports
# ready, then fails at the first prompt.
#
# Deliberately non-fatal. Fleet provisioning shouldn't stop because one credential is stale.
# Only a definitive HTTP 401 is reported as "rejected"; anything else is "could not verify."
paseo_verify_kimicode_credential: true

# --- config ------------------------------------------------------------------------------------
# Kimi Code reads its config from ~/.kimi-code/config.json by default. The role deploys a
# minimal settings file (env vars, regional preferences). Kimi Code generates its own defaults
# on first run, so this is additive — only deploy if you need to override defaults.
paseo_kimicode_config_dest: "{{ paseo_kimicode_data_dir }}/config.json"
# Minimal default settings. An `env` block here can carry credentials, so the file is 0600.
# Extend via paseo_kimicode_settings_extra.
paseo_kimicode_settings: {}
# Deep-merged over the above, so you can add keys without restating them.
paseo_kimicode_settings_extra: {}

# --- Paseo provider registration ---------------------------------------------------------------
# Pins the ABSOLUTE binary path with the `acp` subcommand at config.json →
# agents.providers.kimi.command. Verified against the daemon's own schema: a `command` array
# takes the override branch of resolveProviderLaunch and is checked with a literal existsSync.
# `command: ["kimi", "acp"]` launches Kimi Code in ACP mode (JSON-RPC over stdio).
#
# NOTE: `kimi` is NOT a builtin Paseo provider. It must be registered as a custom provider
# with `agents.providers.kimi`. This adds it to the provider list alongside Claude/OpenCode/Codex.
paseo_register_kimicode_provider: true

# =============================================================================
# Daemon config.json export (grab it back to the controller)
# =============================================================================
paseo_fetch_daemon_config: false
paseo_daemon_config_fetch_dir: "./fetched-daemon-config"
# Redacted by default: the bcrypt password hash is stripped before the file leaves the host.
# Saved to <fetch_dir>/<host>/config.json. Set false to fetch the raw file instead
# (lands at <fetch_dir>/<host>/<remote/path>/config.json).
paseo_daemon_config_redact: true
